[package]
name = "multipapr"
version = "0.1.1"
edition = "2024"
description = "Physically aligned panoramic wallpapers for Windows"

[dependencies]
anyhow = "1"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["ico", "png", "jpeg", "bmp", "gif", "webp"] }
rfd = "0.15"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_StationsAndDesktops"] }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["util"] }

[profile.release]
strip = true

[build-dependencies]
sha2 = "0.11"
winresource = "0.1"
